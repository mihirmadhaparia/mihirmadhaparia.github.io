name: Strava sync (Beyond page)

# Weekly on Monday 09:00 UTC, plus a manual "Run workflow" button for testing.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python tools/strava_sync.py

      - name: Commit updated data
        run: |
          git config user.name "strava-sync-bot"
          git config user.email "actions@github.com"
          git add assets/data/beyond.json assets/images/strava/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: sync Beyond page from Strava"
            git push
          fi
